            </button>

        <main class="editor-preview-container">
          <section class="sidebar sidebar--contracted">
            <button class="sidebar__expand" tabindex="-1" aria-label="Open sketch files">
              <svg width="10" height="15" viewBox="0 0 10 15" aria-hidden="true"><polygon transform="translate(4.999999, 7.198314) rotate(90.000000) translate(-4.999999, -7.198314)" points="6.399999 4.396629 11.999999 9.996629 10.599999 11.396629 4.999999 5.796629 -0.600001 11.396629 -2.000001 9.996629 3.599999 4.396629 4.996627 2.999999"/></svg>
            </button>
          </section>

          <section class="editor-console">
            <div class="editor-container">
              <div class="editor__header">
                <div class="editor__file-name">
                  <span>sketch.js</span>
                  <span class="timer__saved-time">Saved: 12 minutes ago</span>
                </div>
              </div>
              <div class="editor-holder">
                <div id="code" class="cm-editor"></div>
              </div>
            </div>

            <section class="preview-console">
              <header class="preview-console__header">
                <h2 class="preview-console__header-title">Console</h2>
                <div class="preview-console__header-buttons">
                  <button class="preview-console__clear" tabindex="-1">Clear</button>
                  <button class="preview-console__collapse" tabindex="-1" aria-label="Close console">
                    <svg width="15" height="10" viewBox="0 0 10 15" aria-hidden="true"><polygon transform="translate(4.999999, 7.198314) rotate(180.000000) translate(-4.999999, -7.198314)" points="6.399999 4.396629 11.999999 9.996629 10.599999 11.396629 4.999999 5.796629 -0.600001 11.396629 -2.000001 9.996629 3.599999 4.396629 4.996627 2.999999"/></svg>
                  </button>
                </div>
              </header>
              <div class="preview-console__body">
                <div class="preview-console__messages" id="console-messages"></div>
                <div class="console__input">
                  <div class="console-active__arrow-container">
                    <svg class="console-active__arrow" width="10" height="15" viewBox="0 0 10 15" aria-hidden="true"><polygon transform="translate(4.999999, 7.198314) rotate(90.000000) translate(-4.999999, -7.198314)" points="6.399999 4.396629 11.999999 9.996629 10.599999 11.396629 4.999999 5.796629 -0.600001 11.396629 -2.000001 9.996629 3.599999 4.396629 4.996627 2.999999"/></svg>
                  </div>
                </div>
              </div>
            </section>
          </section>

          <section class="preview-frame-holder">
            <header class="preview-frame__header">
              <h2 class="preview-frame__title">Preview</h2>
            </header>
            <!-- The live Webdog canvas starts here, then gets physically pulled out. -->
            <div class="preview-frame__content" id="preview">
              <div id="preview-hole"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ===================================================================
         THE "FREE" WORLD: Webdog's 3D block. The live p5 canvas is moved into
         .block__front during the breakout.
         =================================================================== -->
    <div id="block-anchor">
      <div id="block-shadow"></div>
      <div id="block-float">
        <div id="block-look">
        <div id="block">
          <div class="block__face block__front" id="block-front"></div>
          <div class="block__face block__back"></div>
          <div class="block__face block__left"></div>
          <div class="block__face block__right"></div>
          <div class="block__face block__top"></div>
          <div class="block__face block__bottom"></div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <!-- The twinkle where the kicked-away editor disappears -->
  <div id="sparkle" aria-hidden="true">✦</div>

  <!-- Webdog's words once he's free (never drawn inside the canvas after the breakout) -->
  <div id="caption" aria-live="polite"></div>

  <script src="js/tools.js"></script>
